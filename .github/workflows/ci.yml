name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        neovim: [stable, nightly]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        id: neovim
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: Install plenary
        run: |
          git clone --depth 1 https://github.com/nvim-lua/plenary.nvim /tmp/plenary

      - name: Run tests
        run: |
          nvim --headless -c "set rtp+=/tmp/plenary" \
            -c "lua vim.cmd('set rtp+=' .. vim.fn.getcwd())" \
            -c "lua require('plenary.test_harness').test_directory('tests/', { minimal_init = 'tests/init.lua' })" \
            -c "qa!"
